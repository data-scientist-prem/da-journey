<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DA Journey</title>
<meta name="description" content="Private Data Analyst preparation app">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF8F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FBF8F2;--surface:#FFFFFF;--surface2:#F3EFE6;--surface3:#EBE5D8;--border:#E7E1D4;--border2:#D9D1C1;
 --text:#1C1917;--muted:#6B6459;--faint:#8F877A;
 --primary:#059669;--primary-text:#047857;--primary-soft:#E3F4EC;--on-primary:#FFFFFF;
 --amber:#D97706;--amber-text:#9A4F04;--amber-soft:#FCF0DC;
 --danger:#B91C1C;--danger-soft:#FBE7E7;--info:#2563EB;
 --c-excel:#15803D;--c-sql:#2563EB;--c-powerbi:#B45309;--c-python:#7C3AED;--c-stats:#DB2777;--c-career:#0E7490;--c-github:#374151;--c-projects:#C2410C;--c-habits:#64748B;--c-linkedin:#0A66C2;
 --shadow1:0 1px 2px rgba(28,25,23,.06),0 1px 3px rgba(28,25,23,.04);
 --shadow2:0 8px 24px rgba(28,25,23,.08),0 2px 6px rgba(28,25,23,.05);
 --r:14px;--r-sm:10px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
 color-scheme:light;
}
html[data-theme="dark"]{
 --bg:#0F1513;--surface:#16201C;--surface2:#1D2A25;--surface3:#24332D;--border:#2A3832;--border2:#37483F;
 --text:#E8EFEB;--muted:#9DB0A7;--faint:#7D8F86;
 --primary:#34D399;--primary-text:#5EE3B0;--primary-soft:#173A2E;--on-primary:#052E22;
 --amber:#F5A524;--amber-text:#F7B955;--amber-soft:#3A2C12;
 --danger:#F87171;--danger-soft:#3B1D1D;--info:#7AA7FF;
 --c-excel:#4ADE80;--c-sql:#7AA7FF;--c-powerbi:#FBBF24;--c-python:#B79CFF;--c-stats:#F472B6;--c-career:#4FD1E6;--c-github:#B8C2CC;--c-projects:#FB923C;--c-habits:#A3B1C2;--c-linkedin:#5EA8F2;
 --shadow1:0 1px 2px rgba(0,0,0,.3);--shadow2:0 10px 30px rgba(0,0,0,.35);
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
h1,h2,h3,h4{font-family:var(--head);line-height:1.25;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:800}h2{font-size:1.25rem;font-weight:750}h3{font-size:1.05rem;font-weight:700}h4{font-size:.95rem;font-weight:700}
p{margin:0 0 .6em}
a{color:var(--primary-text)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.sm{width:15px;height:15px}svg.i.lg{width:22px;height:22px}svg.i.xl{width:60px;height:60px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:8px;z-index:100}.skip:focus{left:8px}

/* layout */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--head);font-weight:800;font-size:1.12rem}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary);flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;min-height:44px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text)}
.side .mini{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.minicard{background:var(--surface2);border-radius:12px;padding:12px}
.minicard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.syncline{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;padding:0 6px}
.main{min-width:0;padding:28px 32px 60px}
.wrap{max-width:1240px;margin:0 auto}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:1023px){
 .shell{grid-template-columns:1fr}
 .side{display:none}
 .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 16px;border-bottom:1px solid var(--border)}
 .main{padding:18px 16px 96px}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:10px;min-height:48px;justify-content:center}
 .tabbar a[aria-current="page"]{color:var(--primary-text);background:var(--primary-soft)}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow1)}
.card+.card{margin-top:14px}
.grid>.card,.stack>.card,.grid>a.card{margin-top:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{color:var(--muted);margin:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.76rem}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}.row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;color:var(--text);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--cc,var(--muted)) 13%,transparent);color:var(--cc,var(--muted));white-space:nowrap}
.chip.plain{background:var(--surface2);color:var(--muted)}
.chip.ok{--cc:var(--primary-text)}.chip.warn{--cc:var(--amber-text)}.chip.bad{--cc:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s ease-out}
.bar.amber>i{background:var(--amber)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:650;font-size:.86rem}
.input,textarea.input,select.input{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
textarea.input{resize:vertical;min-height:84px;line-height:1.5}
.help{font-size:.8rem;color:var(--muted)}
.err{color:var(--danger);font-size:.85rem}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.9rem}
.note.amber{background:var(--amber-soft);color:var(--amber-text)}
.note.green{background:var(--primary-soft);color:var(--primary-text)}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
pre.code,code.code{font-family:var(--mono);font-size:.84rem}
pre.code{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;margin:8px 0;white-space:pre}
.kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--primary-text);border-bottom-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:200;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1023px){.toast{bottom:84px}}
.modal-bg{position:fixed;inset:0;background:rgba(15,21,19,.45);z-index:150;display:grid;place-items:center;padding:16px;animation:fade .15s ease-out}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow2);width:min(560px,100%);max-height:90dvh;overflow:auto;padding:22px;animation:rise .2s ease-out}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* today */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:22px}
.hero h1{margin-bottom:4px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-family:var(--head);font-size:1.45rem;font-weight:800;line-height:1}
.ring .lbl span{font-size:.72rem;color:var(--muted);margin-top:3px}
.stats-mini{display:flex;flex-direction:column;gap:10px;min-width:210px}
.streak{display:flex;align-items:center;gap:10px;background:var(--amber-soft);color:var(--amber-text);border-radius:12px;padding:10px 12px;font-weight:700}
.streak svg{color:var(--amber)}
.lvl{background:var(--surface2);border-radius:12px;padding:10px 12px}
.lvl .row{justify-content:space-between;font-size:.82rem;font-weight:650}
.heat-legend{display:inline-flex;gap:3px}.heat-legend i{width:12px;height:12px;border-radius:3px;background:var(--surface3)}
.heat-legend i.l1{background:color-mix(in srgb,var(--primary) 30%,var(--surface3))}.heat-legend i.l2{background:color-mix(in srgb,var(--primary) 55%,var(--surface3))}.heat-legend i.l3{background:color-mix(in srgb,var(--primary) 80%,var(--surface3))}.heat-legend i.l4{background:var(--primary)}
@media (max-width:520px){.hero .stats-mini{flex-direction:column}.ring{width:92px;height:92px}}
@media (max-width:820px){.hero{grid-template-columns:auto 1fr}.hero .stats-mini{grid-column:1/-1;flex-direction:row;min-width:0}.hero .stats-mini>*{flex:1}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start;margin-top:18px}
@media (max-width:1180px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:20px}
@media (max-width:1180px){.sticky{position:static}}
.secthead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.secthead h3{margin:0;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.task:hover{border-color:var(--border2);box-shadow:var(--shadow1)}
.task[aria-selected="true"]{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.task .ttl{font-weight:600;line-height:1.35}
.task .meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border2)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;padding:0;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.check.part{border-color:var(--primary);color:var(--primary)}
.est{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail h2{margin-bottom:8px}
.reslist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;min-height:44px}
.res:hover{background:var(--surface2)}
.res .sub{font-weight:500;color:var(--muted);font-size:.8rem}
.donecard{text-align:center;padding:26px}
.donecard .big{width:58px;height:58px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;margin:0 auto 10px}

/* plan */
.block{margin-bottom:22px}
.blockhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dtile{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px;min-height:92px;transition:border-color .15s,box-shadow .15s}
.dtile:hover{border-color:var(--border2);box-shadow:var(--shadow1)}
.dtile .d{font-size:.74rem;color:var(--muted);font-weight:650;display:flex;justify-content:space-between}
.dtile .t{font-size:.82rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dtile.done{background:var(--primary-soft);border-color:transparent}
.dtile.cur{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.dtile.rest{background:var(--surface2);border-style:dashed;color:var(--muted)}
.dtile .bar{height:5px;margin-top:auto}

/* practice */
.setcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--text)}
.setcard:hover{border-color:var(--border2)}
.ws{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ws{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:4px;max-height:calc(100dvh - 160px);overflow:auto}
@media (max-width:900px){.rail{flex-direction:row;overflow-x:auto;max-height:none;align-items:center}.rail>div{display:none}}
.rail button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted);min-height:40px;flex:none}
.rail button:hover{background:var(--surface2)}
.rail button[aria-current="true"]{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow1)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--surface3);flex:none}
.dot.ok{background:var(--primary)}.dot.peek{background:var(--amber)}.dot.try{background:var(--border2);outline:2px solid var(--amber);outline-offset:1px}
.lvlchip{font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.ed{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:var(--surface);min-height:220px}
.ed:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.ed-gut{background:var(--surface2);color:var(--faint);text-align:right;padding:12px 8px;font-family:var(--mono);font-size:.84rem;line-height:1.6;white-space:pre;overflow:hidden;user-select:none;min-width:38px}
.ed-ta{border:0;outline:none;resize:vertical;padding:12px;font-family:var(--mono);font-size:.84rem;line-height:1.6;background:transparent;min-height:220px;white-space:pre;overflow:auto;tab-size:4}
.out{border:1px solid var(--border);border-radius:12px;background:var(--surface2);padding:12px 14px;min-height:60px;font-size:.9rem}
.out pre{margin:0;font-family:var(--mono);font-size:.84rem;white-space:pre-wrap;word-break:break-word}
.out .stderr{color:var(--danger)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.verdict.ok{background:var(--primary-soft);color:var(--primary-text)}
.verdict.bad{background:var(--danger-soft);color:var(--danger)}
table.tbl{border-collapse:collapse;width:100%;font-size:.84rem}
table.tbl th,table.tbl td{border-bottom:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
table.tbl th{font-weight:700;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tblwrap{overflow:auto;max-height:340px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
details.mini{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface)}
details.mini summary{cursor:pointer;font-weight:650;font-size:.88rem;min-height:28px}
.drill{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.drill .n{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1px solid var(--border2);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:550;min-height:48px;margin-bottom:8px}
.opt:hover{border-color:var(--primary)}
.opt.right{border-color:var(--primary);background:var(--primary-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt .k{font-weight:800;color:var(--muted);min-width:18px}
.opt code{font-family:var(--mono);font-size:.85rem}

/* progress */
.kpi b{font-family:var(--head);font-size:1.6rem;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}

/* animated icons (Hunter-style) */

@keyframes flk1{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(-3deg)}60%{transform:scale(1.03,.95) skewX(2deg)}}
@keyframes flk2{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.14)}70%{transform:scale(1.06,.9)}}

@keyframes frzspin{to{transform:rotate(360deg)}}

.check{position:relative;overflow:visible}

@keyframes draw{to{stroke-dashoffset:0}}

.ahead .secthead h3{color:var(--primary-text)}

.sndbtn[aria-pressed="false"]{opacity:.65}
@media (prefers-reduced-motion:reduce){.check.justdone,.check.justdone svg path,.check .spark,.check.justdone::after,.task.justdone,.task.justdone .ttl,.shake,.pop2,#topstreak.bump,.lvlburst::before{animation:none!important}.check.justdone svg path{stroke-dashoffset:0}.check .spark{display:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.xpfloat{position:fixed;z-index:300;font-weight:800;color:var(--primary-text);pointer-events:none;animation:xpup .9s ease-out forwards;font-size:15px;text-shadow:0 1px 0 var(--bg)}
@keyframes xpup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

/* ---------- Python / SQL runner (Pyodide in a worker) ---------- */
const Runner={worker:null,state:'idle',version:'',seq:0,pending:{},initP:null,error:'',ls:new Set(),
 notify(){Runner.ls.forEach(f=>f())},
 start(){if(Runner.initP)return Runner.initP;Runner.state='loading';Runner.notify();
  Runner.initP=new Promise(res=>{let w;try{w=new Worker('worker.js')}catch(e){Runner.fail('Worker blocked: '+e.message);res(false);return}Runner.worker=w;
   const tm=setTimeout(()=>{if(Runner.state==='loading'){Runner.fail('Loading took too long (internet?)');res(false)}},180000);
   w.onmessage=ev=>{const m=ev.data;if(m.type==='ready'){clearTimeout(tm);Runner.state='ready';Runner.version=m.version;Runner.notify();res(true)}
    else if(m.type==='initfail'){clearTimeout(tm);Runner.fail(m.error);res(false)}
    else{const p=Runner.pending[m.id];if(!p)return;if(m.type==='status')p.onStatus&&p.onStatus(m.text);else if(m.type==='started')p.startExec();else if(m.type==='result')p.done(m)}};
   w.onerror=e=>{clearTimeout(tm);if(Runner.state==='loading'){Runner.fail(e.message||'Worker error');res(false)}};
   const ov=DEV&&/[?&]pyodide=([^&]+)/.exec(location.search);w.postMessage({type:'init',bases:ov?[decodeURIComponent(ov[1])]:CFG.PYODIDE})});return Runner.initP},
 fail(m){Runner.state='failed';Runner.error=m;Runner.notify()},
 restart(){if(Runner.worker)Runner.worker.terminate();Runner.worker=null;Runner.initP=null;Runner.state='idle';Runner.pending={};return Runner.start()},
 call(msg,ms,onStatus){return Runner.start().then(ok=>{if(!ok)return{crash:true,stderr:'Runner not available: '+Runner.error};
  return new Promise(res=>{const id=++Runner.seq;let tm=null;const fin=r=>{clearTimeout(tm);delete Runner.pending[id];res(r)};
   Runner.pending[id]={onStatus,startExec(){clearTimeout(tm);tm=setTimeout(()=>{delete Runner.pending[id];res({timeout:true,stderr:'Stopped: ran longer than '+(ms/1000)+' s (infinite loop or waiting for input?).'});Runner.restart()},ms)},done:fin};
   msg.id=id;Runner.worker.postMessage(msg)})})},
 runPy(p,o){return Runner.call({type:'run',code:o.code,echo:!!o.echo,stdin:o.stdin==null?'':o.stdin,args:o.args||[],files:o.files||{},pkgs:p.pkgs||[]},20000,o.onStatus)},
 runSql(setup,q,check){return Runner.call({type:'sql',setup,query:q,check:check||''},15000)}};

/* ---------- grading ---------- */
const Grade={
 norm(s,ws){s=String(s==null?'':s).replace(/\r\n?/g,'\n');if(ws)return s.split(/\s+/).filter(Boolean).join(' ');
  const l=s.split('\n').map(x=>x.replace(/\s+$/,''));while(l.length&&l[l.length-1]==='')l.pop();while(l.length&&l[0]==='')l.shift();return l.join('\n')},
 isNum:t=>/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t),
 tokEq(a,b){if(a===b)return true;if(Grade.isNum(a)&&Grade.isNum(b)){const x=parseFloat(a),y=parseFloat(b);return Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(x),Math.abs(y))}return false},
 py(p,out){const a=Grade.norm(out,p.ws),b=Grade.norm(p.ex,p.ws);if(a===b)return{ok:true};const la=a.split('\n'),lb=b.split('\n');
  if(la.length===lb.length){let same=true,nd=false;for(let i=0;i<la.length&&same;i++){const ta=la[i].split(/\s+/).filter(Boolean),tb=lb[i].split(/\s+/).filter(Boolean);if(ta.length!==tb.length){same=false;break}
   for(let j=0;j<ta.length;j++){if(!Grade.tokEq(ta[j],tb[j])){same=false;break}if(ta[j]!==tb[j])nd=true}}
   if(same)return nd?{ok:true,note:'Numbers match; only the format differs (e.g. 16 vs 16.0).'}:{ok:true}}return{ok:false}},
 cell:v=>typeof v==='number'?'n'+(Math.round(v*1e6)/1e6):(v===null?'null':'s'+v),
 sql(p,res){if(!res||res.error)return{ok:false,msg:res&&res.error};if(res.none)return{ok:false,msg:'The query returned no result table. It must end with a SELECT.'};const ex=p.ex;
  if(p.names){const a=res.cols.map(c=>String(c).toLowerCase()).join(','),b=ex.cols.map(c=>String(c).toLowerCase()).join(',');if(a!==b)return{ok:false,msg:'Column names differ. Expected: '+ex.cols.join(', ')}}
  if(res.cols.length!==ex.cols.length)return{ok:false,msg:`Expected ${ex.cols.length} column(s), got ${res.cols.length}.`};
  const ra=res.rows.map(r=>r.map(Grade.cell).join('\u0001')),rb=ex.rows.map(r=>r.map(Grade.cell).join('\u0001'));
  if(ra.length!==rb.length)return{ok:false,msg:`Expected ${rb.length} row(s), got ${ra.length}.`};
  if(p.ordered){let same=true;for(let i=0;i<ra.length;i++)if(ra[i]!==rb[i]){same=false;break}
   if(same)return{ok:true};const sa=[...ra].sort(),sb=[...rb].sort();if(sa.every((x,i)=>x===sb[i]))return{ok:false,msg:'Rows are correct but the order is wrong (check ORDER BY).'};return{ok:false,msg:'Rows do not match.'}}
  ra.sort();rb.sort();for(let i=0;i<ra.length;i++)if(ra[i]!==rb[i])return{ok:false,msg:'Rows do not match.'};return{ok:true}},
 drill(it,v){v=String(v||'').trim();if(!v)return null;if(it.type==='num'){const n=parseFloat(v.replace(/[,₹\s%]/g,''));if(isNaN(n))return{ok:false,msg:'Enter a number only.'};
  const tol=it.tol!=null?it.tol:0.01;return{ok:Math.abs(n-it.ans)<=Math.max(tol,Math.abs(it.ans)*1e-9)}}
  const a=v.toLowerCase().replace(/\s+/g,' '),b=String(it.ans).toLowerCase().replace(/\s+/g,' ');return{ok:a===b}}};
